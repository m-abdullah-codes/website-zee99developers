name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            brochures/zee99lifestyle/package-lock.json

      - run: npm ci

      # The e-brochure is a separate Astro app under brochures/, built into
      # public/ by `npm run build` below. --omit=dev skips Playwright, which
      # only its local screenshot scripts use.
      - name: Install e-brochure dependencies
        working-directory: brochures/zee99lifestyle
        run: npm ci --omit=dev

      - name: Pull content from D1
        run: node scripts/pull-content.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build static export
        run: npm run build

      - name: Deploy Worker + assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
